[project]
name = "ghdeck"
version = "0.2.0"
description = "GithubDeck, a Windows desktop manager for multiple GitHub CLI accounts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.11.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.15.0",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
